<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (same pattern as Binary Brain, but use your handwriting icon) -->
    <link rel="icon" type="image/png" href="/mayo.png" />

    <!-- Preconnect for Google Fonts (performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Mulish font (mirroring Binary Brain's setup) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary meta tags -->
    <title>MAYO Handwriting AI | Free AI Handwriting to Text by Victor Mayowa</title>
    <meta
      name="description"
      content="Convert handwriting to digital text instantly with AI. Built by Victor Mayowa (MAYO). Free, secure, and no sign-up required."
    />

    <!-- Open Graph (Facebook, LinkedIn, Pinterest) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MAYO Handwriting AI | Free Handwriting to Text" />
    <meta
      property="og:description"
      content="Convert handwriting to digital text with AI. Built by Victor Mayowa."
    />
    <meta property="og:image" content="https://mayo-handwriting-ai.vercel.app/og-image.png" />
    <meta property="og:url" content="https://mayo-handwriting-ai.vercel.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MAYO Handwriting AI | Free Handwriting to Text" />
    <meta
      name="twitter:description"
      content="Convert handwriting to digital text with AI. Built by Victor Mayowa."
    />
    <meta name="twitter:image" content="https://mayo-handwriting-ai.vercel.app/twitter-card.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://mayo-handwriting-ai.vercel.app" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
